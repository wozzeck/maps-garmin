# =============================================================================
# zonas/pirineos.conf
# Configuración para la zona "Pirineos"
# Uso: bash crear_mapa.sh pirineos
# =============================================================================

# Nombre legible que aparecerá en el Garmin
NOMBRE_MAPA="Pirineos"

# Bounding box (lat_sur lat_norte lon_oeste lon_este)
BBOX_SUR=41.3
BBOX_NORTE=43.8
BBOX_OESTE=-1.9
BBOX_ESTE=3.3

# Polígono opcional para recorte fino (relativo al repo)
# Si está vacío (""), se usa el bounding box rectangular
POLIGONO="zonas/pirineos.poly"

# Fuentes OSM a combinar (URLs de Geofabrik o similares)
FUENTES_OSM=(
    "http://download.geofabrik.de/europe/spain/aragon-latest.osm.pbf"
    "http://download.geofabrik.de/europe/spain/cataluna-latest.osm.pbf"
    "http://download.geofabrik.de/europe/spain/navarra-latest.osm.pbf"
    "http://download.geofabrik.de/europe/spain/pais-vasco-latest.osm.pbf"
    "http://download.geofabrik.de/europe/france/aquitaine-latest.osm.pbf"
    "http://download.geofabrik.de/europe/france/midi-pyrenees-latest.osm.pbf"
    "http://download.geofabrik.de/europe/france/languedoc-roussillon-latest.osm.pbf"
    "http://download.geofabrik.de/europe/andorra-latest.osm.pbf"
)

# ID base para mkgmap (3 dígitos). Cada zona DEBE usar uno único.
# Los IDs reales se construyen como: 44<MAPID_BASE>xxx (OSM) y 55<MAPID_BASE>xxx (curvas)
MAPID_BASE="889"

# RAM para Java (formato -Xmx)
RAM_JAVA="8192m"
