# =============================================================================
# Plantilla de zona — copia este archivo a zonas/MI_ZONA.conf y rellena los campos.
# Después puedes generar el mapa con: bash crear_mapa.sh MI_ZONA
# =============================================================================

# Nombre legible que aparece en el dispositivo Garmin (sin caracteres con tilde).
# Ej: "Pirineos", "Mallorca", "Sierra Nevada"
NOMBRE_MAPA=""

# -----------------------------------------------------------------------------
# Bounding box (rectángulo geográfico que cubre la zona)
# Los valores son grados decimales (positivo = Norte/Este, negativo = Sur/Oeste).
# Pista: usa https://boundingbox.klokantech.com/ para dibujar uno visualmente.
# -----------------------------------------------------------------------------
BBOX_SUR=        # latitud mínima (sur)
BBOX_NORTE=      # latitud máxima (norte)
BBOX_OESTE=      # longitud mínima (oeste)
BBOX_ESTE=       # longitud máxima (este)

# -----------------------------------------------------------------------------
# Polígono de recorte fino (opcional)
# Si quieres limitar la zona a un contorno irregular en lugar del rectángulo,
# crea un archivo .poly (formato osmosis) y pon la ruta aquí.
# Si lo dejas vacío, se usa el bounding box rectangular.
# -----------------------------------------------------------------------------
POLIGONO=""

# -----------------------------------------------------------------------------
# Fuentes OSM (URLs de extractos .osm.pbf que cubren la zona)
# Para una sola región basta con una URL.
# Para zonas que cruzan varios extractos regionales (ej. fronterizas), añade
# todas las que la cubran — el script las fusiona y recorta al polígono/bbox.
# Recomendado: https://download.geofabrik.de
# -----------------------------------------------------------------------------
FUENTES_OSM=(
    "http://download.geofabrik.de/europe/PAIS/REGION-latest.osm.pbf"
)

# -----------------------------------------------------------------------------
# ID base de mkgmap (3 dígitos, 100-999).
# CADA ZONA DEBE USAR UN ID ÚNICO — si dos mapas comparten ID en el mismo
# Garmin, uno se sobrescribe.
# Valores ya en uso:
#   001-128 → países en country.txt
#   889     → Pirineos
#   890     → Mallorca
# Usa cualquier valor libre, p. ej. 500-799 o 900+.
# -----------------------------------------------------------------------------
MAPID_BASE=""

# -----------------------------------------------------------------------------
# RAM máxima para Java (formato -Xmx).
# Recomendaciones según tamaño de zona:
#   Zona pequeña (provincia, isla):  2048m  o  4096m
#   Zona media (región, varios extractos):  4096m  o  6144m
#   Zona grande (país, Alpes...): 8192m+
# Si el build falla con OutOfMemoryError, sube este valor.
# -----------------------------------------------------------------------------
RAM_JAVA="4096m"
