# =============================================================================
# zonas/mallorca.conf
# Configuración para la zona "Mallorca"
# Uso: bash crear_mapa.sh mallorca
# =============================================================================

# Nombre legible que aparecerá en el Garmin
NOMBRE_MAPA="Mallorca"

# Bounding box (lat_sur lat_norte lon_oeste lon_este)
BBOX_SUR=39.2
BBOX_NORTE=40.0
BBOX_OESTE=2.3
BBOX_ESTE=3.5

# Polígono opcional para recorte fino (relativo al repo)
# Si está vacío (""), se usa el bounding box rectangular
POLIGONO=""

# Fuentes OSM a combinar (URLs de Geofabrik o similares)
FUENTES_OSM=(
    "http://download.geofabrik.de/europe/spain/islas-baleares-latest.osm.pbf"
)

# ID base para mkgmap (3 dígitos). Cada zona DEBE usar uno único.
# Los IDs reales se construyen como: 44<MAPID_BASE>xxx (OSM) y 55<MAPID_BASE>xxx (curvas)
MAPID_BASE="890"

# RAM para Java (formato -Xmx)
RAM_JAVA="4096m"
